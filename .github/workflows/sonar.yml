name: CI/CD pipeline for Node.js

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # required for Sonar blame info

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3️⃣ Install Dependencies
      - name: Install frontend dependencies
        run: npm install
        working-directory: ./client

      - name: Install backend dependencies
        run: npm install
        working-directory: ./server

      # 4️⃣ Dummy Test
      - name: Dummy Test Frontend
        run: echo "No tests yet" && exit 0
        working-directory: ./client

      - name: Dummy Test Backend
        run: echo "No tests yet" && exit 0
        working-directory: ./server

      # 5️⃣ SonarQube Scan Frontend
      - name: SonarQube Scan Frontend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: -Dproject.settings=client/sonar-project.properties
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 6️⃣ SonarQube Scan Backend
      - name: SonarQube Scan Backend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: -Dproject.settings=server/sonar-project.properties
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
