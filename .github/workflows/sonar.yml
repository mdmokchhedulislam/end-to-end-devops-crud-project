name: CI/CD workflow for Node.js Build and Sonar Code Scan

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: http://50.19.42.141:9000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm install
        working-directory: ./client

      # 4. Install backend dependencies
      - name: Install backend dependencies
        run: npm install
        working-directory: ./server

      # 5. Optional dummy test (avoid npm test missing error)
      - name: Dummy Test Frontend
        run: echo "No tests yet" && exit 0
        working-directory: ./client

      - name: Dummy Test Backend
        run: echo "No tests yet" && exit 0
        working-directory: ./server

      # 6. SonarQube Scan Frontend
      - name: SonarQube Scan Frontend
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ SONAR_HOST_URL}}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=frontend-project
            -Dsonar.projectName=NodeJS-Frontend
            -Dsonar.sources=client

      # 7. SonarQube Scan Backend
      - name: SonarQube Scan Backend
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL:  ${{ SONAR_HOST_URL}}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=backend-project
            -Dsonar.projectName=NodeJS-Backend
            -Dsonar.sources=server
