name: End-to-End DevOps CI/CD

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: http://50.19.42.141:9000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3
        
      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Frontend Compilation
      - name: Frontend Compilation
        run: |
          cd client
          find . -name "*.js" -exec node --check {} +

      # 4. Backend Compilation
      - name: Backend Compilation
        run: |
          cd server
          find . -name "*.js" -exec node --check {} +

      # 5. GitLeaks Scan
      - name: GitLeaks Scan
        run: |
          gitleaks detect --source ./client --exit-code 1 || true
          gitleaks detect --source ./server --exit-code 1 || true

      # 6. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm install
        working-directory: ./client

      # 7. Install backend dependencies
      - name: Install backend dependencies
        run: npm install
        working-directory: ./server

      # 8. SonarQube Scan Frontend
      - name: SonarQube Scan Frontend
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=frontend-project
            -Dsonar.sources=client
            -Dsonar.javascript.lcov.reportPaths=client/coverage/lcov.info

      # 9. SonarQube Scan Backend
      - name: SonarQube Scan Backend
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=backend-project
            -Dsonar.sources=server
            -Dsonar.javascript.lcov.reportPaths=server/coverage/lcov.info

      # 10. Trivy FS Scan
      - name: Trivy FS Scan
        run: trivy fs --format table -o fs-report.html .

      # 11. Build & Push Backend Docker Image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: mokchhedul/branchbackend:latest
          load: false
          secrets: |
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_PASSWORD }}

      # 12. Trivy Backend Image Scan
      - name: Trivy Backend Image Scan
        run: trivy image --format table -o backend-image-report.html mokchhedul/branchbackend:latest

      # 13. Build & Push Frontend Docker Image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: mokchhedul/branchfrontend:latest
          load: false
          secrets: |
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_PASSWORD }}

      # 14. Trivy Frontend Image Scan
      - name: Trivy Frontend Image Scan
        run: trivy image --format table -o frontend-image-report.html mokchhedul/branchfrontend:latest
