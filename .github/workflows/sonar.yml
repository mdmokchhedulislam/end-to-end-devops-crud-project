name: End-to-End DevOps CI/CD

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: http://50.19.42.141:9000
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Frontend Compilation (syntax check)
      - name: Frontend Syntax Check
        run: |
          cd client
          find . -name "*.js" -exec node --check {} +

      # 4. Backend Compilation (syntax check)
      - name: Backend Syntax Check
        run: |
          cd server
          find . -name "*.js" -exec node --check {} +

      # 5. GitLeaks Scan
      - name: GitLeaks Scan
        run: |
          gitleaks detect --source ./client --exit-code 1
          gitleaks detect --source ./server --exit-code 1

      # 6. Install dependencies
      - name: Install frontend dependencies
        run: npm install
        working-directory: ./client

      - name: Install backend dependencies
        run: npm install
        working-directory: ./server

      # 7. SonarQube Scans
      - name: SonarQube Scan Frontend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=frontend-project
            -Dsonar.sources=client
            -Dsonar.javascript.lcov.reportPaths=client/coverage/lcov.info

      - name: SonarQube Scan Backend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=backend-project
            -Dsonar.sources=server
            -Dsonar.javascript.lcov.reportPaths=server/coverage/lcov.info

      # 8. Trivy FS Scan
      - name: Trivy FS Scan
        run: trivy fs --exit-code 1 --format table -o fs-report.html .

      # 9. Docker Login
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 10. Build & Push Backend Docker Image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./server
          push: true
          tags: mokchhedul/branchbackend:latest

      # 11. Trivy Backend Image Scan
      - name: Trivy Backend Image Scan
        run: trivy image --exit-code 1 --format table -o backend-image-report.html mokchhedul/branchbackend:latest

      # 12. Build & Push Frontend Docker Image
      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./client
          push: true
          tags: mokchhedul/branchfrontend:latest

      # 13. Trivy Frontend Image Scan
      - name: Trivy Frontend Image Scan
        run: trivy image --exit-code 1 --format table -o frontend-image-report.html mokchhedul/branchfrontend:latest
