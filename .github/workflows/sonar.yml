name: sonarqube code quality check assainment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./client

      - name: Install backend dependencies
        run: npm install
        working-directory: ./server

      - name: Dummy Test Frontend
        run: echo "No tests yet" && exit 0
        working-directory: ./client

      - name: Dummy Test Backend
        run: echo "No tests yet" && exit 0
        working-directory: ./server

      - name: SonarQube Scan Frontend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: -Dproject.settings=client/sonar-project.properties
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Scan Backend
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: -Dproject.settings=server/sonar-project.properties
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
